[project]
name = "granama"
version = "0.1.0"
description = "Fast multi-word anagram generator"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/granama/data/en/SCOWL-COPYRIGHT.txt"]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
lm = [
    "sentence-transformers>=6.1.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[project.scripts]
granama = "granama.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/granama"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "ty>=0.0.83",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["granama"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ty.analysis]
# optional `lm` extra; not installed in CI
allowed-unresolved-imports = ["numpy", "torch", "transformers", "transformers.**", "sentence_transformers"]
